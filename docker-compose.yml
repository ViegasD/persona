services:
  # ─── Infrastructure ──────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres_ensaio
    restart: always
    networks:
      - ensaio_net
    ports:
      - "5591:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ensaio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ensaio_dev_123}
      POSTGRES_DB: ${POSTGRES_DB:-ensaio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensaio"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_ensaio
    restart: always
    networks:
      - ensaio_net
    ports:
      - "6541:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio_ensaio
    restart: always
    networks:
      - ensaio_net
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ensaio_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ensaio-images}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/$$MINIO_BUCKET --ignore-existing;
      mc anonymous set download local/$$MINIO_BUCKET;
      echo 'Bucket criado com sucesso';
      "

  # ─── Evolution API (WhatsApp) ────────────────────────────

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_ensaio
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ensaio_net
    ports:
      - "9281:8080"
    env_file:
      - .env
    volumes:
      - evolution_data:/evolution/instances

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evolution_data:

networks:
  ensaio_net:
    driver: bridge
